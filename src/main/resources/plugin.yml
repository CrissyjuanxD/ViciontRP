name: ViciontRP
version: '${project.version}'
main: com.viciontstudios.rp.ViciontRP
api-version: '1.18'
author: CrissyjuanxD
website: https://github.com/CrissyjuanxD/ViciontRP
description: Envía el pack de recursos de tu instancia de Viciont Studios Launcher a quien entra sin el launcher.
commands:
  viciontrp:
    description: Estado y recarga de ViciontRP
    usage: /viciontrp <status|reload>
    permission: viciontrp.admin
permissions:
  viciontrp.admin:
    description: Usar /viciontrp
    default: op
  viciontrp.bypass:
    description: Nunca recibe el pack del servidor
    default: false
