name: Probar ViciontRP

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp package
        working-directory: plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin/target/ViciontRP-*.jar

  mod:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ['1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2', '26.3']
    name: Mod ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -Ptarget=${{ matrix.target }} build
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.target }}
          path: mod/build/libs/ViciontRP-mod-${{ matrix.target }}-*.jar

  server:
    needs: plugin
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.4'
            java: '21'
            mode: bot
          - mc: '26.3'
            java: '25'
            mode: load
    name: Paper ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: plugin/target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash test/server.sh ${{ matrix.mc }} ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.mc }}
          path: server-*.log
          if-no-files-found: ignore

  client:
    needs: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: '1.21.1', paper: '1.21.1' }
          - { target: '1.21.4', paper: '1.21.4' }
          - { target: '1.21.5', paper: '1.21.5' }
          - { target: '1.21.8', paper: '1.21.8' }
          - { target: '1.21.10', paper: '1.21.10' }
          - { target: '1.21.11', paper: '1.21.11' }
          - { target: '26.1', paper: '26.1.2' }
          - { target: '26.2', paper: '26.2' }
          - { target: '26.3', paper: '26.3' }
    name: Juego ${{ matrix.target }}
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: plugin/target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Pantalla virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool mesa-utils libgl1-mesa-dri libegl1 mesa-vulkan-drivers vulkan-tools libxkbcommon-x11-0 > /dev/null
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          glxinfo -B | head -20 || true
      - run: bash test/server.sh ${{ matrix.paper }} client ${{ matrix.target }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juego-${{ matrix.target }}
          path: |
            screens-*/
            client-*.log
            server-*.log
          if-no-files-found: ignore
