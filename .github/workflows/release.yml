name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar la versión
        run: |
          v="${GITHUB_REF_NAME#v}"
          pom="$(sed -n 's|^    <version>\(.*\)</version>|\1|p' plugin/pom.xml | head -1)"
          mod="$(sed -n 's|^version=||p' mod/gradle.properties)"
          [ "$v" = "$pom" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con plugin/pom.xml ($pom)"; exit 1; }
          [ "$v" = "$mod" ] || { echo "La etiqueta $GITHUB_REF_NAME no coincide con mod/gradle.properties ($mod)"; exit 1; }
          [ -f "docs/releases/$v.md" ] || { echo "Faltan las notas docs/releases/$v.md"; exit 1; }

  mod:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: ['1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -Ptarget=${{ matrix.target }} build
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.target }}
          path: mod/build/libs/ViciontRP-mod-${{ matrix.target }}-*.jar

  release:
    needs: mod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: mvn -B -ntp package
        working-directory: plugin
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: jars
          merge-multiple: true
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          mapfile -t mods < <(node mod/index.mjs "$v" "$GITHUB_REF_NAME" jars mod.json)
          gh release create "$GITHUB_REF_NAME" "plugin/target/ViciontRP-$v.jar" "${mods[@]}" mod.json --title "ViciontRP $v" --notes-file "docs/releases/$v.md"
